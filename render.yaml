services:
  - type: web
    name: farmers-market-api
    env: docker
    # region options: frankfurt, oregon, singapore, etc.
    region: frankfurt
    # free tier: 'starter'; paid: 'standard', 'pro', etc.
    plan: starter
    envVars:
      - key: APP_NAME
        value: "Farmers Market Platform"
      - key: APP_ENV
        value: production
      # Render will generate and persist a key automatically
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: "https://farmers-market-api.onrender.com"
      - key: DB_CONNECTION
        value: mysql
      # Change this to your Render MySQL internal hostname or external DB host
      - key: DB_HOST
        value: "farmers-market-db.internal"
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: farmers_market
      - key: DB_USERNAME
        value: farmers_market
      - key: DB_PASSWORD
        value: "CHANGE_ME_IN_RENDER_DASHBOARD"
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "localhost:3000,localhost:5173,farmers-market-api.onrender.com"
      - key: SESSION_DOMAIN
        value: ".onrender.com"
      - key: MARKET_DEFAULT_INTEREST_RATE
        value: "0.05"
      - key: MARKET_CURRENCY
        value: "XOF"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug

  # Optional: managed PostgreSQL. Replace with your own MySQL/PostgreSQL instance.
  # If you already have an external MySQL host, remove this block and set DB_HOST accordingly.
  # - type: pserv
  #   name: farmers-market-db
  #   env: docker
  #   # only if you want a self-managed DB
  #   dockerfilePath: ./docker/mysql.Dockerfile

